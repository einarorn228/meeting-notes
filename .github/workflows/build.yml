name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the installers'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sidecar unit tests
        working-directory: sidecar
        run: |
          python -m pip install -r requirements.txt pytest jiwer
          python -m pytest -q -m "not slow"

  prepare-release:
    name: Create the draft release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # electron-builder creates the draft itself if it is missing - and three platform jobs packaging at the
      # same second create three of them. That happened once: the Windows installer went into one draft named
      # v0.1.14 and the mac and Linux ones into another, so neither was a complete release. Creating the draft
      # here, before any platform starts, leaves them nothing to race over.
      - name: Create the draft release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "Sjá breytingar í samantekt útgáfunnar." --target "$GITHUB_SHA"
          fi

  build:
    name: Build installers (${{ matrix.os }})
    needs: [test, prepare-release]
    # prepare-release is skipped on ordinary pushes, which must still build.
    if: ${{ !cancelled() && needs.test.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.prepare-release.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            sidecar_dir: win
          - os: macos-latest
            target: mac
            sidecar_dir: mac
          - os: ubuntu-latest
            target: linux
            sidecar_dir: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build standalone sidecar (PyInstaller)
        shell: bash
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm fundarritari-stt.spec
          mkdir -p ../resources/sidecar-bin/${{ matrix.sidecar_dir }}
          cp -R dist/fundarritari-stt ../resources/sidecar-bin/${{ matrix.sidecar_dir }}/
      - name: Smoke-test the sidecar binary
        shell: bash
        # A sidecar that builds but crashes on startup reaches the user only as "sidecar exited", so prove
        # the packaged binary actually answers the protocol before it goes into an installer.
        run: |
          BIN=resources/sidecar-bin/${{ matrix.sidecar_dir }}/fundarritari-stt/fundarritari-stt
          [ "${{ matrix.sidecar_dir }}" = "win" ] && BIN="$BIN.exe"
          python scripts/smoke-sidecar.py "$BIN" --full
      - name: Build app
        run: npm run build
      - name: Package (${{ matrix.target }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --publish ${{ (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: fundarritari-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  publish-release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every platform job uploads into the same draft release. Making it public only once they have all
      # finished is what stops an updater seeing a release whose latest.yml has not been uploaded yet.
      - name: Publish the draft once every platform has uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          echo "Publishing $TAG"
          DRAFTS=$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName == \"$TAG\")] | length")
          if [ "$DRAFTS" != "1" ]; then
            echo "::error::Found $DRAFTS releases tagged $TAG - the platform jobs did not upload into one release."
            exit 1
          fi
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          MISSING=""
          for required in latest.yml latest-mac.yml Fundarritari-Setup-win-x64.exe; do
            grep -qx "$required" <<<"$ASSETS" || MISSING="$MISSING $required"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Refusing to publish $TAG - missing asset(s):$MISSING"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
