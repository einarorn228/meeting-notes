appId: is.fundarritari.app
productName: Fundarritari
copyright: Copyright © 2026
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: sidecar
    to: sidecar
    filter:
      - fundarritari_stt/**/*.py
      - requirements.txt
      - pyproject.toml
      - PROTOCOL.md
  - from: resources/icon.png
    to: icon.png
  # Optional: a PyInstaller build of the sidecar placed in resources/sidecar-bin/<os> by CI
  - from: resources/sidecar-bin
    to: bin
    filter:
      - '${os}/**/*'
asar: true
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-Setup-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  license: LICENSE
  language: '1039'
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Fundarritari þarf hljóðnemann til að skrifa upp það sem þú segir á fundum.
    NSAudioCaptureUsageDescription: Fundarritari þarf að heyra hljóðið úr fundarforritinu til að skrifa upp það sem aðrir segja.
    NSScreenCaptureUsageDescription: Notað eingöngu til að ná í kerfishljóð úr fundarforritinu (engin myndupptaka).
  artifactName: ${productName}-Setup-mac-${arch}.${ext}
dmg:
  sign: false
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Einar Örn <einarorn864@gmail.com>
  icon: build/icon.png
  artifactName: ${productName}-Setup-linux-${arch}.${ext}
publish:
  # owner/repo are explicit so the app-update.yml baked into the build always points here, whatever remote
  # the release is built from. electron-updater reads it to find new versions.
  provider: github
  owner: einarorn228
  repo: meeting-notes
  # Draft, not release: each platform job uploads to the same release, so publishing immediately made it
  # public as soon as the first job finished. Updaters then saw a release whose latest.yml did not exist yet
  # ("Cannot find latest.yml ... 404"). CI flips the draft to public only once every platform has uploaded.
  releaseType: draft
