appId: is.fundarritari.app
productName: Fundarritari
copyright: Copyright © 2026
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: sidecar
    to: sidecar
    filter:
      - fundarritari_stt/**/*.py
      - requirements.txt
      - pyproject.toml
      - PROTOCOL.md
  - from: resources/icon.png
    to: icon.png
  # Optional: a PyInstaller build of the sidecar placed in resources/sidecar-bin/<os> by CI
  - from: resources/sidecar-bin
    to: bin
    filter:
      - '${os}/**/*'
asar: true
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  license: LICENSE
  language: '1039'
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Fundarritari þarf hljóðnemann til að skrifa upp það sem þú segir á fundum.
    NSAudioCaptureUsageDescription: Fundarritari þarf að heyra hljóðið úr fundarforritinu til að skrifa upp það sem aðrir segja.
    NSScreenCaptureUsageDescription: Notað eingöngu til að ná í kerfishljóð úr fundarforritinu (engin myndupptaka).
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  sign: false
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: build/icon.png
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish:
  provider: github
  releaseType: release
